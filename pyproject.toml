[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repomentor"
version = "0.10.0"
description = "具有评审反馈记忆、团队规范选择和执行验收能力的编码智能体"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "anthropic>=0.75,<1",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mcp>=1.30,<2",
    "python-dotenv>=1.0,<2",
    "PyYAML>=6,<7",
]

[project.scripts]
repomentor = "repomentor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repomentor"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "repomentor/resources/skills"
